# Publishes paperkid.html as the site root: https://nkarasiak.github.io/paperkid/
# Skipped while the repo is private (the GitHub plan has no Pages for private repos).
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v5
      - run: mkdir site && cp paperkid.html site/index.html
      - uses: actions/upload-pages-artifact@v4
        with: { path: site }
      - uses: actions/deploy-pages@v4
